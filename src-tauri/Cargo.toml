[package]
name = "ytdlp-tauri"
version = "0.1.7"
description = "Interface gráfica para baixar vídeo e áudio com yt-dlp"
authors = ["Yasser"]
edition = "2021"
# Há dois binários (interface e agente); `tauri dev` / `cargo run` abrem a interface
default-run = "ytdlp-tauri"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ytdlp_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "ytdlp-tauri"
path = "src/main.rs"

[[bin]]
name = "ytdlp-tauri-agent"
path = "src/bin/ytdlp-tauri-agent.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.11", features = ["blocking", "json"] }
zip = "0.6"

